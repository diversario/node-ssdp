name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests, ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.12.0 is the oldest version that package.json allows.
        node: ['22.12.0', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  network:
    name: network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner has both docker and podman. The tests need a privileged
      # container, and docker on the runner can start one.
      - run: make test-network
        env:
          CONTAINER_ENGINE: docker

  local:
    name: local network tests, ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest version that package.json allows, and the newest.
        node: ['22.12.0', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # On a macOS runner, a program of the runner user cannot send
      # multicast: the send fails with EHOSTUNREACH. macOS wants the user to
      # allow local network access in a dialog, and nobody can answer a
      # dialog on a runner. A program of root needs no permission.
      - if: runner.os == 'macOS'
        run: sudo env "PATH=$PATH" npm run test:local
      - if: runner.os != 'macOS'
        run: npm run test:local

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ESLint needs a newer Node than the oldest one the package supports.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run coverage
      # Sends the numbers to coveralls.io. The coverage badge in the README
      # shows them. A failed upload does not fail the job.
      - uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          fail-on-error: false
