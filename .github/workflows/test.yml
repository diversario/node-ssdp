name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the oldest version that package.json allows.
        node: ['22.12.0', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  network:
    name: network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner has both docker and podman. The tests need a privileged
      # container, and docker on the runner can start one.
      - run: make test-network
        env:
          CONTAINER_ENGINE: docker
